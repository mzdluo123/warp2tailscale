logging:
  quiet_flows: true  # skip per-flow TCP, UDP, DNS and BBR diagnostics
runtime:
  max_procs: 1  # Go execution parallelism; 0 follows the runtime / container limit
  udp_gso: true  # allow UDP segmentation on WireGuard and MASQUE sockets
tailscale:
  port: 0  # UDP listen port, 0 selects automatically
  hostname: warp-bbr-exit-mvp
  state_dir: ./state/tsnet
egress:
  mode: warp  # warp / direct; omit the warp section in direct mode
warp:
  config_path: ./state/warp/config.json
  transport: masque-h3
  mtu: 1280
  packet_queue_packets: 32
  http3_receive_ring: false  # opt in to the fixed 32-slot HTTP/3 DATAGRAM queue
  reconnect_delay: 1s
  fail_closed: true
congestion:
  type: bbr  # bbr / cubic / reno
  bbrProfile: standard
  initial_cwnd_packets: 32
  pacing_burst_packets: 24
  pacing_burst_window: 1ms  # optional time cap in addition to the packet cap
  max_pacing_bytes_per_second: 0  # per TCP sender; 0 uses BBR estimation
tcp:
  shutdown_grace_period: 2s
  # Per TCP endpoint, in bytes, on the Tailscale stack and on the WARP stack when selected.
  # 0 keeps native defaults; explicit sizes range from 4096 to 67108864.
  send_buffer_bytes: 8388608
  receive_buffer_bytes: 4194304
policy:
  udp: all  # all / dns-only
  icmp: true
  ipv4: true
  ipv6: true
