runtime:
  max_procs: 2  # 0 follows the Go runtime / container CPU limit
tailscale:
  port: 0  # UDP listen port, 0 selects automatically
  hostname: warp-bbr-exit-mvp
  state_dir: ./state/tsnet
warp:
  config_path: ./state/warp/config.json
  transport: masque-h3
  mtu: 1280
  packet_queue_packets: 32
  reconnect_delay: 1s
  fail_closed: true
congestion:
  type: bbr  # bbr / cubic / reno
  bbrProfile: standard
  initial_cwnd_packets: 32
  pacing_burst_packets: 32
  pacing_burst_window: 2ms  # optional time cap in addition to the packet cap
  max_pacing_bytes_per_second: 12000000  # per TCP sender; 0 uses BBR estimation
tcp:
  # Per TCP endpoint, in bytes, on both the Tailscale and WARP stacks.
  # 0 keeps native defaults; explicit sizes range from 4096 to 67108864.
  send_buffer_bytes: 8388608
  receive_buffer_bytes: 4194304
policy:
  udp: all  # all / dns-only
  icmp: true
  ipv4: true
  ipv6: true
